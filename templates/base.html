{% load static %}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Места рядом{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'django/css/site.css' %}" rel="stylesheet">
</head>
<body>
  <header class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container py-2">
      <a class="navbar-brand fw-bold" href="{% url 'homepage:index' %}">Места рядом</a>
      <nav class="d-flex gap-3" aria-label="Основная навигация">
        <a href="{% url 'homepage:index' %}">Главная</a>
        <a href="{% url 'places:list' %}">Места</a>
        <a href="{% url 'recommendations:list' %}">Рекомендации</a>
        {% block extra_nav %}{% endblock %}
        {% if show_sql_nav %}
        <a href="{% url 'places:available' %}">Доступные места</a>
        <a href="{% url 'places:statistics' %}">Статистика</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="container py-5">{% block content %}{% endblock %}</main>
  <footer class="container border-top py-4 text-secondary small">Учебный проект: поиск мест по интересам</footer>
  <script src="{% static 'django/js/site.js' %}" defer></script>
</body>
</html>
