<div class="list-group-item d-flex justify-content-between align-items-center">
  <span>{% if item.user %}{{ item.user.name }}{% else %}{{ item.user_name }}{% endif %} → {% if item.place %}{{ item.place.name }}{% else %}{{ item.place_name }}{% endif %}</span>
  {% if item.is_cancelled %}<span class="badge text-bg-secondary">Отменена</span>
  {% else %}<span class="badge text-bg-success">Активна</span>{% endif %}
</div>
